function set(m){m.innerHTML=`<div class="top" style="justify-content:flex-start;gap:3rem"><button class="ib" id="sb">${ic("back")}</button><h1>Settings</h1></div><div class="set">`+CFG.map(([t,it])=>`<h4>${ic(SI[t])}${t}</h4><div class="box">`+it.map(([k,n,d,o])=>o===1?`<div class="opt tr"><div><div class="nm">${n}</div><p>${d}</p></div><div class="tg ${S.s[k]?"on":""}" data-k="${k}"></div></div>`:`<div class="opt"><div class="nm">${n}</div>${d?`<p>${d}</p>`:""}<div class="chips">${o.map(x=>`<button class="pill ${S.s[k]===x?"on":""}" data-k="${k}" data-v="${x}">${typeof x==="number"&&k==="hold"?x+"x":x}</button>`).join("")}</div></div>`).join("")+`</div>`).join("")+`<h4>${ic("storage")}Storage</h4><div class="box"><div class="opt tr"><div><div class="nm">History &amp; favorites</div><p>${S.h.length} played · ${S.f.length} favorites</p></div><button class="pill" id="cl">Clear</button></div></div><p class="ft">${APP} · web player</p></div>`;

$$(".pill[data-k]").forEach(b=>b.onclick=()=>{const x=b.dataset.v;S.s[b.dataset.k]=isNaN(+x)?x:+x;save();set(m)});
