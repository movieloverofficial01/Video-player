name: Build MoflixBD APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.moflixbd.app",
            "appName": "MoflixBD",
            "webDir": "www",
            "backgroundColor": "#15141a",
            "server": { "androidScheme": "https", "cleartext": true },
            "android": { "allowMixedContent": true, "adjustMarginsForEdgeToEdge": "disable" },
            "plugins": { "SystemBars": { "insetsHandling": "disable", "style": "DARK" } }
          }
          JSON
          npx cap add android
          D=android/app/src/main/java/com/moflixbd/app
          mkdir -p $D
          cp DlPlugin.java PlPlugin.java MainActivity.java $D/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $M
          sed -i 's/<activity /<activity android:supportsPictureInPicture="true" /' $M
          S=android/app/src/main/res/values/styles.xml
          sed -i '/name="AppTheme.NoActionBar"/a\        <item name="android:windowBackground">#15141A</item>\n        <item name="android:statusBarColor">#15141A</item>\n        <item name="android:navigationBarColor">#15141A</item>\n        <item name="android:windowLightStatusBar">false</item>' $S
          sed -i '/^dependencies {/a\    implementation "androidx.media3:media3-exoplayer:1.5.1"\n    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"\n    implementation "androidx.media3:media3-ui:1.5.1"\n    implementation "androidx.media3:media3-database:1.5.1"\n    implementation "androidx.media3:media3-datasource:1.5.1"\n    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.5.1+1"' android/app/build.gradle
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug || { echo "Retrying without FFmpeg decoder"; sed -i '/media3-ffmpeg-decoder/d' app/build.gradle; ./gradlew assembleDebug; }
      - uses: actions/upload-artifact@v4
        with:
          name: MoflixBD-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
