name: Build MoflixBD APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.moflixbd.app",
            "appName": "MoflixBD",
            "webDir": "www",
            "backgroundColor": "#15141a",
            "server": { "androidScheme": "https", "cleartext": true },
            "android": { "allowMixedContent": true }
          }
          JSON
          npx cap add android
          D=android/app/src/main/java/com/moflixbd/app
          mkdir -p $D
          cp DlPlugin.java MainActivity.java $D/
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MoflixBD-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
